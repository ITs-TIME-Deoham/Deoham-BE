plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.deoham'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '2.8.6'
	awsSdkVersion = '2.31.0'
	micronometerVersion = '1.14.0'
	lokiVersion = '1.5.1'
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation "io.micrometer:micrometer-registry-prometheus:${micronometerVersion}"
	implementation 'com.github.loki4j:loki-logback-appender:1.5.1'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sts'

	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	exclude '**/ChatRoomLocationTest.class'
	exclude '**/ChatWebSocketIntegrationTest.class'
	exclude '**/LiveLocationWebSocketIntegrationTest.class'
	systemProperty 'spring.profiles.active', 'test'
}

// 실행 가능한 부팅 JAR 만 남기고 -plain.jar 는 만들지 않는다
// (build/libs 에 JAR 이 2개면 배포 시 COPY/cp 가 애매해짐)
tasks.named('jar') {
	enabled = false
}

// 로컬 실행 시 .env 파일을 읽어 bootRun 프로세스의 환경변수로 주입한다.
// (docker compose 는 env_file 로 .env 를 읽으므로, gradlew bootRun 경로도 동일한 파일을 참조하도록 맞춘다.)
tasks.named('bootRun') {
	doFirst {
		def envFile = file('.env')
		if (envFile.exists()) {
			envFile.readLines().each { line ->
				line = line.trim()
				if (line && !line.startsWith('#') && line.contains('=')) {
					def idx = line.indexOf('=')
					def key = line.substring(0, idx).trim()
					def value = line.substring(idx + 1).trim()
					if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
						value = value.substring(1, value.length() - 1)
					}
					if (key) {
						environment key, value
					}
				}
			}
		}
	}
}
