global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'deoham-monitor'
    environment: '${SPRING_PROFILES_ACTIVE:-local}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'deoham-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['app:8080']
