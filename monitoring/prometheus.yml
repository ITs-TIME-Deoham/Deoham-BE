global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'deoham-monitor'
    # Prometheus 설정 파일은 환경변수 치환을 지원하지 않으므로 고정값 사용
    environment: 'dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'deoham-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    static_configs:
      # compose 네트워크의 app 서비스 — localhost는 Prometheus 컨테이너 자신을 가리킴
      - targets: ['app:8080']
