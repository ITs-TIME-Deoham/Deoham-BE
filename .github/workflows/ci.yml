name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 이미지 경로 (소문자 고정)
  IMAGE_NAME: ghcr.io/its-time-ondo/ondo-be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # GHCR push 용
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Testcontainers(Postgres)는 러너의 Docker 데몬을 사용한다
      - name: Build & test
        run: ./gradlew --no-daemon clean build

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      # --- 이미지 빌드 & push (develop push 일 때만) ---
      # EC2(t3.micro) 대신 러너에서 이미지를 만들어 GHCR 에 올린다 → 배포 시 EC2 메모리 스파이크 제거
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          # .dockerignore 가 build/ 를 제외하므로 부팅 JAR 을 컨텍스트 루트로 복사
          cp build/libs/*.jar app.jar
          docker build -f Dockerfile.deploy \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read         # EC2 에서 GHCR pull 시 이 토큰을 넘겨 로그인

    steps:
      - uses: actions/checkout@v4   # compose.yaml 확보용

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Create .env
        run: |
          cat > .env << 'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod

          # DataSource — compose 내부 postgres 컨테이너
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deoham
          SPRING_DATASOURCE_USERNAME=deoham
          SPRING_DATASOURCE_PASSWORD=deoham

          # Redis — compose 내부 redis 컨테이너
          SPRING_DATA_REDIS_HOST=redis
          SPRING_DATA_REDIS_PORT=6379
          SPRING_DATA_REDIS_SSL=false

          # JWT — HS256 signing secret (최소 32자)
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          # AWS S3 (필수 — @NotBlank/@Positive, EC2 IAM 역할로 자격증명 자동 처리)
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_PRESIGNED_TTL=${{ secrets.AWS_S3_PRESIGNED_TTL }}

          # CORS
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}

          # Kakao OAuth
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI=${{ vars.KAKAO_REDIRECT_URI }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}

          # Gemini — (구) 채팅 메시지 번역 프로바이더, DeepL 전환 후 미사용이나 @NotBlank 바인딩 유지용
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          # DeepL — 채팅 메시지 번역 프로바이더 (현재 @Primary)
          DEEPL_API_KEY=${{ secrets.DEEPL_API_KEY }}

          # FCM — 서비스 계정 키는 secrets/ 에 파일로 마운트, 여기서는 컨테이너 내 경로만 지정
          FCM_KEY_PATH=/app/secrets/fcm-service-account.json

          # Kakao Map — Java 바인딩 없음, 구현 완료 후 활성화
          # KAKAO_MAP_REST_API_KEY=${{ secrets.KAKAO_MAP_REST_API_KEY }}

          # Monitoring Stack Versions
          PROMETHEUS_VERSION=v2.47.0
          LOKI_VERSION=3.0.0
          GRAFANA_VERSION=10.2.0

          # Grafana Admin & GitHub OAuth
          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_OAUTH_CLIENT_ID=${{ secrets.GRAFANA_OAUTH_CLIENT_ID }}
          GRAFANA_OAUTH_CLIENT_SECRET=${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}
          ENVEOF
          # compose 가 pull 할 이미지 태그 (커밋 SHA 로 핀 고정) — compose 의 ${APP_IMAGE} 로 치환됨
          echo "APP_IMAGE=$IMAGE_NAME:${{ github.sha }}" >> .env

      # FCM 서비스 계정 키(JSON)를 파일로 복원 → compose 가 read-only 로 컨테이너에 마운트
      # 멀티라인 JSON 이므로 .env 에 넣지 않고 별도 파일로 전달한다
      - name: Write FCM service account key
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" > secrets/fcm-service-account.json
          if [ ! -s secrets/fcm-service-account.json ]; then
            echo "⚠ FCM_SERVICE_ACCOUNT_JSON 시크릿이 비어 있습니다 — 푸시가 비활성화된 채로 기동됩니다"
          else
            echo "✓ FCM 키 파일 생성 (bytes: $(wc -c < secrets/fcm-service-account.json))"
          fi

      - name: Validate environment variables
        run: |
          echo "=== Checking required environment variables ==="
          MISSING_VARS=""
          for var in JWT_SECRET AWS_S3_REGION AWS_S3_BUCKET AWS_S3_PRESIGNED_TTL \
                      KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET GEMINI_API_KEY DEEPL_API_KEY \
                      GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD; do
            if grep -q "^$var=$" .env; then
              echo "❌ ERROR: $var is empty"
              MISSING_VARS="$MISSING_VARS $var"
            else
              # 값이 있는지 확인 (^var=.+ 패턴)
              if grep -q "^$var=..*" .env; then
                echo "✓ $var is set"
              else
                echo "❌ ERROR: $var is missing from .env"
                MISSING_VARS="$MISSING_VARS $var"
              fi
            fi
          done

          if [ -n "$MISSING_VARS" ]; then
            echo ""
            echo "🚨 Deploy aborted: Missing or empty secrets:$MISSING_VARS"
            echo "Please set the following secrets in GitHub repository settings:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo ""
          echo "✓ All required environment variables are set"

      # A. 스왑 보장 — t3.micro(1GB) OOM 방지. 없을 때만 2G swapfile 생성 (재부팅에도 유지)
      - name: Ensure swap on EC2 (idempotent)
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          if sudo swapon --show | grep -q '/swapfile'; then
            echo "swap already present"
          else
            echo "Creating 2G swapfile..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            sudo sysctl -w vm.swappiness=10
            grep -q 'vm.swappiness' /etc/sysctl.conf || echo 'vm.swappiness=10' | sudo tee -a /etc/sysctl.conf
          fi
          free -h
          ENDSSH

      # C. Let's Encrypt 인증서 자동 갱신 cron 보장 (idempotent, 인증서는 최초 1회 수동 발급 필요)
      - name: Ensure certbot renewal cron on EC2 (idempotent)
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          CRON_CMD="cd ~/deoham && docker compose run --rm certbot renew --quiet && docker compose exec -T nginx nginx -s reload"
          # grep -v 는 결과가 0줄이면 exit 1 을 반환하므로(빈 crontab 등) `|| true` 로 set -e 중단을 방지
          ( crontab -l 2>/dev/null | grep -vF "docker compose run --rm certbot renew" || true ; echo "0 3 * * * $CRON_CMD >> ~/deoham/certbot-renew.log 2>&1" ) | crontab -
          echo "certbot renewal cron ensured:"
          crontab -l | grep certbot
          ENDSSH

      - name: Prepare EC2 directory & transfer files
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/deoham/monitoring ~/deoham/nginx ~/deoham/secrets"
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            -r compose.yaml monitoring nginx secrets .env \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/deoham/

      # B. EC2 는 빌드 없이 GHCR 에서 pull 만 한다
      - name: Deploy on EC2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" << 'ENDSSH'
          set -e
          cd ~/deoham

          echo "=== GHCR login ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "=== Pull & start ==="
          docker compose down
          docker compose pull

          # 인증서가 이미 있으면 HTTPS 서버 블록을 기동 전에 활성화한다.
          # (인증서 없이 ssl.conf 가 conf.d 에 있으면 nginx 기동 실패 → 최초 발급 전에는 HTTP-only 로 기동)
          echo "=== Enable HTTPS config if certificate exists ==="
          # </dev/null 필수 — docker compose run 이 stdin 을 attach 하면 heredoc 의 나머지 스크립트를 삼켜버린다
          if docker compose run --rm --entrypoint sh certbot -c 'test -e /etc/letsencrypt/live/piec.store/fullchain.pem' </dev/null 2>/dev/null; then
            cp nginx/ssl.conf nginx/conf.d/ssl.conf
            echo "✓ Existing certificate found — ssl.conf enabled"
          else
            echo "No certificate yet — starting HTTP-only (will issue after startup)"
          fi

          docker compose up -d

          echo "=== Prune old images ==="
          docker image prune -af || true
          docker logout ghcr.io || true

          echo "=== Pre-deployment checks ==="

          # DB 연결 확인
          echo "Testing database connectivity..."
          for i in {1..10}; do
            if docker exec deoham-postgres-1 psql -U deoham -d deoham -c "SELECT 1" &>/dev/null; then
              echo "✓ Database is ready"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Database failed to start"
              docker compose logs postgres | tail -20
              exit 1
            fi
            echo "  Attempt $i/10..."
            sleep 2
          done

          # Redis 연결 확인
          echo "Testing Redis connectivity..."
          for i in {1..10}; do
            if docker exec deoham-redis-1 redis-cli ping &>/dev/null; then
              echo "✓ Redis is ready"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Redis failed to start"
              docker compose logs redis | tail -20
              exit 1
            fi
            echo "  Attempt $i/10..."
            sleep 2
          done

          # 포트 확인
          if ! netstat -tuln 2>/dev/null | grep -q :8080 && ! ss -tuln 2>/dev/null | grep -q :8080; then
            echo "⚠ Port 8080 not yet bound (app starting...)"
          fi

          echo ""
          echo "=== Waiting for application startup ==="
          sleep 40

          echo ""
          echo "=== Checking deoham-app-1 container health ==="
          max_attempts=5
          wait_time=15
          healthy=0

          for attempt in $(seq 1 $max_attempts); do
            health_status=$(docker inspect deoham-app-1 --format '{{.State.Health.Status}}' 2>/dev/null || echo "none")

            if [ "$health_status" = "healthy" ]; then
              echo "✓ Application container is healthy"
              healthy=1
              break
            fi

            if [ $attempt -lt $max_attempts ]; then
              echo "Attempt $attempt/$max_attempts failed"
              echo "  Retrying in ${wait_time}s (exponential backoff)..."
              sleep $wait_time
            fi
          done

          echo ""
          echo "=== Container status ==="
          docker compose ps

          if [ "$healthy" -ne 1 ]; then
            echo ""
            echo "❌ Health check failed after $max_attempts attempts"
            echo ""
            echo "=== Application logs (last 100 lines) ==="
            docker compose logs --tail=100 app || true
            echo ""
            echo "=== Database logs ==="
            docker compose logs --tail=100 postgres || true
            echo ""
            echo "=== Redis logs ==="
            docker compose logs --tail=100 redis || true
            exit 1
          fi

          echo ""
          echo "=== Ensure Let's Encrypt certificate (piec.store) ==="
          if [ ! -f nginx/conf.d/ssl.conf ]; then
            # nginx 가 떠서 ACME challenge(/.well-known/acme-challenge/)를 서빙할 수 있을 때까지 대기
            for i in {1..12}; do
              nginx_state=$(docker inspect deoham-nginx-1 --format '{{.State.Status}}' 2>/dev/null || echo "none")
              [ "$nginx_state" = "running" ] && break
              echo "  Waiting for nginx... ($i/12)"
              sleep 5
            done

            if docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
                 -d piec.store -d www.piec.store \
                 --email toosee1005@gmail.com --agree-tos --no-eff-email --non-interactive </dev/null; then
              cp nginx/ssl.conf nginx/conf.d/ssl.conf
              docker compose exec -T nginx nginx -s reload </dev/null
              echo "✓ Certificate issued & HTTPS enabled"
            else
              # 발급 실패(LE rate limit 등)로 배포 전체를 실패시키지는 않는다 — HTTP 로는 계속 서비스
              echo "⚠ Certificate issuance failed — serving HTTP-only. Check logs and re-deploy."
            fi
          fi

          echo ""
          echo "=== HTTPS smoke test ==="
          if curl -sf --resolve piec.store:443:127.0.0.1 https://piec.store/actuator/health > /dev/null; then
            echo "✓ https://piec.store/actuator/health OK"
          else
            echo "⚠ HTTPS health check failed (certificate may not be issued yet)"
          fi

          echo ""
          echo "✅ ==================================="
          echo "✅ === Deploy succeeded ==="
          echo "✅ ==================================="
          ENDSSH

      - name: Cleanup sensitive files
        if: always()
        run: rm -rf private_key.pem .env secrets
