name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 이미지 경로 (소문자 고정)
  IMAGE_NAME: ghcr.io/its-time-ondo/ondo-be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # GHCR push 용
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build -x test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      # --- 이미지 빌드 & push (develop push 일 때만) ---
      # EC2(t3.micro) 대신 러너에서 이미지를 만들어 GHCR 에 올린다 → 배포 시 EC2 메모리 스파이크 제거
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          # .dockerignore 가 build/ 를 제외하므로 부팅 JAR 을 컨텍스트 루트로 복사
          cp build/libs/*.jar app.jar
          docker build -f Dockerfile.deploy \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read         # EC2 에서 GHCR pull 시 이 토큰을 넘겨 로그인

    steps:
      - uses: actions/checkout@v4   # compose.yaml 확보용

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Create .env
        run: |
          cat > .env << 'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod

          # DataSource — compose 내부 postgres 컨테이너
          SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deoham
          SPRING_DATASOURCE_USERNAME=deoham
          SPRING_DATASOURCE_PASSWORD=deoham

          # Redis — compose 내부 redis 컨테이너
          SPRING_DATA_REDIS_HOST=redis
          SPRING_DATA_REDIS_PORT=6379
          SPRING_DATA_REDIS_SSL=false

          # JWT — HS256 signing secret (최소 32자)
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          # Supabase JWT — Firebase 전환 전 임시 플레이스홀더 (Swagger 접근용)
          SUPABASE_JWT_ISSUER=https://placeholder.supabase.co/auth/v1
          SUPABASE_JWT_JWKS_URI=https://placeholder.supabase.co/auth/v1/.well-known/jwks.json
          SUPABASE_JWT_AUDIENCE=authenticated

          # AWS S3 (필수 — @NotBlank/@Positive, EC2 IAM 역할로 자격증명 자동 처리)
          AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_PRESIGNED_TTL=${{ secrets.AWS_S3_PRESIGNED_TTL }}

          # CORS
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}

          # Kakao OAuth
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI=${{ vars.KAKAO_REDIRECT_URI }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}

          # Gemini — 채팅 메시지 번역 프로바이더
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          # FCM — Java 바인딩 없음, 구현 완료 후 활성화
          # FCM_KEY_PATH=/app/secrets/fcm-service-account.json

          # Kakao Map — Java 바인딩 없음, 구현 완료 후 활성화
          # KAKAO_MAP_REST_API_KEY=${{ secrets.KAKAO_MAP_REST_API_KEY }}

          # Monitoring Stack Versions
          PROMETHEUS_VERSION=v2.47.0
          LOKI_VERSION=3.0.0
          GRAFANA_VERSION=10.2.0

          # Grafana Admin & GitHub OAuth
          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_OAUTH_CLIENT_ID=${{ secrets.GRAFANA_OAUTH_CLIENT_ID }}
          GRAFANA_OAUTH_CLIENT_SECRET=${{ secrets.GRAFANA_OAUTH_CLIENT_SECRET }}
          ENVEOF
          # compose 가 pull 할 이미지 태그 (커밋 SHA 로 핀 고정) — compose 의 ${APP_IMAGE} 로 치환됨
          echo "APP_IMAGE=$IMAGE_NAME:${{ github.sha }}" >> .env

      - name: Validate environment variables
        run: |
          echo "=== Checking required environment variables ==="
          MISSING_VARS=""
          for var in JWT_SECRET AWS_S3_REGION AWS_S3_BUCKET AWS_S3_PRESIGNED_TTL \
                      KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD; do
            if grep -q "^$var=$" .env; then
              echo "❌ ERROR: $var is empty"
              MISSING_VARS="$MISSING_VARS $var"
            else
              # 값이 있는지 확인 (^var=.+ 패턴)
              if grep -q "^$var=..*" .env; then
                echo "✓ $var is set"
              else
                echo "❌ ERROR: $var is missing from .env"
                MISSING_VARS="$MISSING_VARS $var"
              fi
            fi
          done

          if [ -n "$MISSING_VARS" ]; then
            echo ""
            echo "🚨 Deploy aborted: Missing or empty secrets:$MISSING_VARS"
            echo "Please set the following secrets in GitHub repository settings:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo ""
          echo "✓ All required environment variables are set"

      # A. 스왑 보장 — t3.micro(1GB) OOM 방지. 없을 때만 2G swapfile 생성 (재부팅에도 유지)
      - name: Ensure swap on EC2 (idempotent)
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          if sudo swapon --show | grep -q '/swapfile'; then
            echo "swap already present"
          else
            echo "Creating 2G swapfile..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            sudo sysctl -w vm.swappiness=10
            grep -q 'vm.swappiness' /etc/sysctl.conf || echo 'vm.swappiness=10' | sudo tee -a /etc/sysctl.conf
          fi
          free -h
          ENDSSH

      - name: Prepare EC2 directory & transfer files
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/deoham/monitoring"
          scp -i private_key.pem -o StrictHostKeyChecking=no \
            -r compose.yaml monitoring .env \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/deoham/

      # B. EC2 는 빌드 없이 GHCR 에서 pull 만 한다
      - name: Deploy on EC2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" << 'ENDSSH'
          set -e
          cd ~/deoham

          echo "=== GHCR login ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "=== Pull & start ==="
          docker compose pull
          docker compose up -d

          echo "=== Prune old images ==="
          docker image prune -af || true
          docker logout ghcr.io || true

          echo "=== Pre-deployment checks ==="

          # DB 연결 확인
          echo "Testing database connectivity..."
          for i in {1..10}; do
            if docker exec deoham-postgres-1 psql -U deoham -d deoham -c "SELECT 1" &>/dev/null; then
              echo "✓ Database is ready"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Database failed to start"
              docker compose logs postgres | tail -20
              exit 1
            fi
            echo "  Attempt $i/10..."
            sleep 2
          done

          # Redis 연결 확인
          echo "Testing Redis connectivity..."
          for i in {1..10}; do
            if docker exec deoham-redis-1 redis-cli ping &>/dev/null; then
              echo "✓ Redis is ready"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Redis failed to start"
              docker compose logs redis | tail -20
              exit 1
            fi
            echo "  Attempt $i/10..."
            sleep 2
          done

          # 포트 확인
          if ! netstat -tuln 2>/dev/null | grep -q :8080 && ! ss -tuln 2>/dev/null | grep -q :8080; then
            echo "⚠ Port 8080 not yet bound (app starting...)"
          fi

          echo ""
          echo "=== Waiting for application startup ==="
          sleep 15

          echo ""
          echo "=== Health check (with exponential backoff) ==="
          healthy=0
          max_attempts=5

          for attempt in $(seq 1 $max_attempts); do
            wait_time=$((60 + (attempt - 1) * 5))

            # Readiness probe
            if curl -sf http://localhost:8080/actuator/health/readiness &>/dev/null; then
              echo "✓ Application readiness check passed"

              # DB probe
              if curl -sf http://localhost:8080/actuator/health/db &>/dev/null; then
                echo "✓ Database connectivity verified"
              else
                echo "⚠ Database health check warning (will retry)"
              fi

              # Redis probe
              if curl -sf http://localhost:8080/actuator/health/redis &>/dev/null; then
                echo "✓ Redis connectivity verified"
              else
                echo "⚠ Redis health check warning (will retry)"
              fi

              # Overall health
              HEALTH=$(curl -sf http://localhost:8080/actuator/health 2>/dev/null | grep -o '"status":"[^"]*"')
              echo "✓ Overall health: $HEALTH"
              healthy=1
              break
            fi

            if [ $attempt -lt $max_attempts ]; then
              echo "Attempt $attempt/$max_attempts failed"
              echo "  Retrying in ${wait_time}s (exponential backoff)..."
              sleep $wait_time
            fi
          done

          echo ""
          echo "=== Container status ==="
          docker compose ps

          if [ "$healthy" -ne 1 ]; then
            echo ""
            echo "❌ Health check failed after $max_attempts attempts"
            echo ""
            echo "=== Application logs (last 100 lines) ==="
            docker compose logs --tail=100 app || true
            echo ""
            echo "=== Database logs ==="
            docker compose logs --tail=100 postgres || true
            echo ""
            echo "=== Redis logs ==="
            docker compose logs --tail=100 redis || true
            exit 1
          fi

          echo ""
          echo "✅ ==================================="
          echo "✅ === Deploy succeeded ==="
          echo "✅ ==================================="
          ENDSSH

      - name: Cleanup sensitive files
        if: always()
        run: rm -f private_key.pem .env
