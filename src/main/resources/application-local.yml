spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5300/deoham?sslmode=disable
    username: deoham
    password: deoham
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET:my-test-secret-key-minimum-32-characters-required}
  access-token-expiry-seconds: 3600
  refresh-token-expiry-seconds: 604800

deoham:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:683885f3d0ae05d5d74cb2298f6a2976}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/kakao/callback}
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:ondo-2026-itstime}

fcm:
  service-account-key-path: src/main/resources/firebase/local-service-account.json

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY:}

logging:
  level:
    com.deoham: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
