spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql://postgres:5432/deoham?sslmode=disable
    username: deoham
    password: deoham
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET:my-test-secret-key-minimum-32-characters-required}
  access-token-expiry-seconds: 3600
  refresh-token-expiry-seconds: 604800

deoham:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080,https://kauth.kakao.com
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/kakao/callback}
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:ondo-2026-itstime}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  deepl:
    api-key: ${DEEPL_API_KEY}
    api-url: ${DEEPL_API_URL:https://api-free.deepl.com}

fcm:
  # 기본: 프로젝트 루트의 gitignore된 키 파일. FCM_KEY_PATH로 절대경로 덮어쓰기 가능
  service-account-key-path: ${FCM_KEY_PATH:src/main/resources/firebase/local-service-account.json}

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY:}

loki:
  url: http://localhost:3100

logging:
  level:
    com.deoham: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
