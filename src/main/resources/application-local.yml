spring:
  docker:
    compose:
      file: compose-local.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/deoham
    username: deoham
    password: deoham
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
deoham:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-minimum-256-bits-change-in-production-!!}
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:ondo-2026-itstime}

fcm:
  service-account-key-path: src/main/resources/firebase/local-service-account.json

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY:}

logging:
  level:
    com.deoham: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
