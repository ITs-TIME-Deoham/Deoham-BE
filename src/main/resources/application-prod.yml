spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}
  jpa:
    show-sql: false
  docker:
    compose:
      file: compose-local.yaml
server:
  tomcat:
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b %D'

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

deoham:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}
    presigned-url-ttl-seconds: ${AWS_S3_PRESIGNED_TTL:600}

fcm:
  # 미설정 시 푸시만 비활성화되고 앱은 정상 기동(graceful). 운영에서는 반드시 주입할 것
  service-account-key-path: ${FCM_KEY_PATH:}

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY}

loki:
  url: ${LOKI_URL:http://localhost:3100}

logging:
  level:
    root: INFO
    com.deoham: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
  file:
    name: ${LOG_FILE_PATH:/var/log/deoham/application.log}
    max-size: 50MB
    max-history: 30
    total-size-cap: 10GB
