spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deoham_test
    username: deoham
    password: deoham
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

jwt:
  secret: "my-test-secret-key-minimum-32-characters-required"

loki:
  url: http://localhost:3100

logging:
  level:
    root: INFO
    com.deoham: DEBUG
  file:
    max-size: 10MB
    max-history: 3
    total-size-cap: 100MB
