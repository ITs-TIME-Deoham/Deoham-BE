spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deoham_test
    username: deoham
    password: deoham
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

jwt:
  secret: "my-test-secret-key-minimum-32-characters-required"

# 테스트 컨텍스트 로딩용 더미 값 — 외부 API는 테스트에서 호출하지 않는다
deoham:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:test-rest-api-key}
    client-secret: ${KAKAO_CLIENT_SECRET:test-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/api/auth/kakao/callback}
  s3:
    bucket: ${AWS_S3_BUCKET:test-bucket}
  deepl:
    api-key: ${DEEPL_API_KEY:test-deepl-key}
    api-url: ${DEEPL_API_URL:https://api-free.deepl.com}

loki:
  url: http://localhost:3100

logging:
  level:
    root: INFO
    com.deoham: DEBUG
  file:
    max-size: 10MB
    max-history: 3
    total-size-cap: 100MB
