spring:
  application:
    name: deoham-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  tomcat:
    max-post-size: 52428800
    multipart:
      max-file-size: 52428800
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    disable-swagger-default-url: true
    default-models-expand-depth: 1
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}
  refresh-token-expiry-seconds: ${JWT_REFRESH_TOKEN_EXPIRY_SECONDS:604800}

deoham:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://kauth.kakao.com,https://ondo-fe.vercel.app}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}
    presigned-url-ttl-seconds: ${AWS_S3_PRESIGNED_TTL:600}
    max-image-size-bytes: ${AWS_S3_MAX_IMAGE_SIZE:52428800}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  deepl:
    api-key: ${DEEPL_API_KEY}
    api-url: ${DEEPL_API_URL:https://api-free.deepl.com}

fcm:
  service-account-key-path: ${FCM_KEY_PATH}

kakao-map:
  rest-api-key: ${KAKAO_MAP_REST_API_KEY}

logging:
  level:
    root: INFO
    com.deoham: INFO
  file:
    name: ${LOG_FILE_PATH:logs/application.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:10}
    total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:1GB}
