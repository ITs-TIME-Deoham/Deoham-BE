services:
  app:
    # EC2에서 직접 빌드하지 않고 GitHub Actions가 GHCR에 올린 이미지를 pull 한다.
    # APP_IMAGE 는 배포 시 .env 로 주입 (미지정 시 latest).
    image: ${APP_IMAGE:-ghcr.io/its-time-ondo/ondo-be:latest}
    env_file:
      - .env
    # volumes:
    #   - ./secrets/fcm-service-account.json:/app/secrets/fcm-service-account.json:ro
    ports:
      - "80:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: deoham
      POSTGRES_USER: deoham
      POSTGRES_PASSWORD: deoham
    ports:
      - "5432:5432"
    volumes:
      - deoham_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deoham -d deoham"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - deoham_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.47.0}
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - deoham_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-50GB}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.0.0}
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - deoham_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.2.0}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - deoham_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  deoham_pg_data:
  deoham_redis_data:
  deoham_prometheus_data:
  deoham_loki_data:
  deoham_grafana_data:
