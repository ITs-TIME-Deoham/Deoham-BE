services:
  app:
    # EC2에서 직접 빌드하지 않고 GitHub Actions가 GHCR에 올린 이미지를 pull 한다.
    # APP_IMAGE 는 배포 시 .env 로 주입 (미지정 시 latest).
    image: ${APP_IMAGE:-ghcr.io/its-time-ondo/ondo-be:latest}
    env_file:
      - .env
    # 파일 로깅 비활성화 - Docker stdout/stderr를 Loki가 수집
    # volumes:
    #   - app_logs:/app/logs
    #   - ./secrets/fcm-service-account.json:/app/secrets/fcm-service-account.json:ro
    # 외부 노출 금지 — nginx가 리버스 프록시로 80/443만 공개
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 50s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - deoham_certbot_conf:/etc/letsencrypt:ro
      - deoham_certbot_www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 상시 구동 서비스가 아님 — `docker compose up -d` 대상에서 제외되고
  # 인증서 최초 발급/갱신 시에만 `docker compose run --rm certbot ...` 로 실행
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - deoham_certbot_conf:/etc/letsencrypt
      - deoham_certbot_www:/var/www/certbot

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: deoham
      POSTGRES_USER: deoham
      POSTGRES_PASSWORD: deoham
    # 외부 노출 금지 — 디버깅은 SSH 터널로 접근
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deoham_pg_data:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deoham -d deoham"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # 외부 노출 금지 — 인증 없는 Redis를 공개 인터페이스에 바인딩하지 않는다
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - deoham_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
      - deoham_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-3d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
      - '--storage.tsdb.max-block-duration=2h'
      - '--query.timeout=2m'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - deoham_alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    user: "0:0"
    # Loki는 인증이 없으므로 외부 노출 금지 (Grafana가 내부 네트워크로 접근)
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - deoham_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-10.2.0}
    ports:
      - "3001:3000"
    environment:
      # 기본 관리자 계정
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 프록시 최적화
      GF_DATAPROXY_TIMEOUT: 10s
      GF_DATAPROXY_DIALTIEMOUT: 10s
      # GitHub OAuth
      GF_AUTH_GITHUB_ENABLED: "true"
      GF_AUTH_GITHUB_ALLOW_SIGN_UP: "false"
      GF_AUTH_GITHUB_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID}
      GF_AUTH_GITHUB_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      GF_AUTH_GITHUB_AUTH_URL: "https://github.com/login/oauth/authorize"
      GF_AUTH_GITHUB_TOKEN_URL: "https://github.com/login/oauth/access_token"
      GF_AUTH_GITHUB_API_URL: "https://api.github.com/user"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - deoham_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  # app_logs: 파일 로깅 비활성화로 제거
  deoham_pg_data:
  deoham_redis_data:
  deoham_prometheus_data:
  deoham_alertmanager_data:
  deoham_loki_data:
  deoham_grafana_data:
  deoham_certbot_conf:
  deoham_certbot_www:
